[[resources]]
id = "repo.oh-my-zsh"
description = "Zsh framework"
tags = ["core", "git"]
kind = "git_repo"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
destination = "~/.oh-my-zsh"

[[resources]]
id = "repo.powerlevel10k"
description = "Zsh prompt theme"
tags = ["core", "git"]
kind = "git_repo"
url = "https://github.com/romkatv/powerlevel10k.git"
destination = "~/.oh-my-zsh/custom/themes/powerlevel10k"
depends_on = ["repo.oh-my-zsh"]

[[resources]]
id = "repo.zsh-autosuggestions"
description = "Interactive Zsh suggestions"
tags = ["core", "git"]
kind = "git_repo"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
destination = "~/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
depends_on = ["repo.oh-my-zsh"]

[[resources]]
id = "repo.zsh-syntax-highlighting"
description = "Zsh command highlighting"
tags = ["core", "git"]
kind = "git_repo"
url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
destination = "~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
depends_on = ["repo.oh-my-zsh"]

[[resources]]
id = "repo.tpm"
description = "Tmux plugin manager"
tags = ["core", "git"]
kind = "git_repo"
url = "https://github.com/tmux-plugins/tpm.git"
destination = "~/.tmux/plugins/tpm"

