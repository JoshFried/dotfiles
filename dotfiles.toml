version = 1
default_profiles = ["core", "development", "desktop"]

[profiles]
core = [
    "formula.git",
    "formula.tmux",
    "formula.fzf",
    "formula.ripgrep",
    "formula.fd",
    "formula.jq",
    "formula.bat",
    "formula.tree",
    "formula.wget",
    "formula.curl",
    "formula.coreutils",
    "formula.zsh",
    "formula.eza",
    "formula.zoxide",
    "formula.sesh",
    "formula.fastfetch",
    "formula.thefuck",
    "formula.btop",
    "formula.television",
    "repo.oh-my-zsh",
    "repo.powerlevel10k",
    "repo.zsh-autosuggestions",
    "repo.zsh-syntax-highlighting",
    "repo.tpm",
    "symlink.zshrc",
    "symlink.aliases",
    "symlink.editorconfig",
    "symlink.dotfiles-cli",
    "symlink.tmux",
    "symlink.sesh",
    "symlink.fastfetch",
    "symlink.btop",
]
development = [
    "formula.neovim",
    "formula.lazygit",
    "formula.git-delta",
    "formula.go",
    "formula.rustup",
    "formula.openjdk",
    "formula.kotlin",
    "formula.nvm",
    "formula.python",
    "formula.bun",
    "formula.cmake",
    "formula.make",
    "symlink.nvim",
    "symlink.lazygit",
]
desktop = [
    "cask.ghostty",
    "cask.wezterm",
    "cask.hammerspoon",
    "cask.aerospace",
    "cask.karabiner",
    "cask.raycast",
    "cask.qmk-toolbox",
    "cask.firefox",
    "cask.font-jetbrains-mono",
    "cask.font-recursive-mono",
    "cask.font-sf-mono",
    "formula.sketchybar",
    "formula.borders",
    "formula.sketchybar-app-font",
    "formula.nowplaying-cli",
    "formula.blueutil",
    "symlink.ghostty",
    "symlink.wezterm",
    "symlink.hammerspoon",
    "symlink.aerospace",
    "symlink.aerospace-assign",
    "symlink.aerospace-toast",
    "symlink.karabiner",
    "symlink.sketchybar",
    "symlink.borders",
    "symlink.cal-events",
    "service.sketchybar",
    "service.borders",
]

