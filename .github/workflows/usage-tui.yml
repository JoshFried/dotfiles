name: Usage TUI

on:
  pull_request:
    paths:
      - ".github/workflows/usage-tui.yml"
      - "usage-tui/**"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/usage-tui.yml"
      - "usage-tui/**"
      - "rust-toolchain.toml"

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --manifest-path usage-tui/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path usage-tui/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run tests and native collector smoke test
        run: cargo test --manifest-path usage-tui/Cargo.toml --all-targets --locked
