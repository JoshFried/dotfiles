[package]
name = "dotfiles-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "dotfiles"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
anstyle = "1.0"
clap = { version = "4.5", default-features = false, features = [
    "color",
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
